body{font-family:"Naskh","Noto Naskh Arabic",Tahoma,sans-serif;font-synthesis:none;font-size:17px;line-height:1.6;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--brand);color:#fff;padding:10px 16px;position:-webkit-sticky;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.15);display:flex;align-items:center;gap:10px}
header .ttl{flex:1;min-width:0}
header h1{margin:0;font-size:20px}
header .sub{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;background:rgba(255,255,255,.15);border-radius:10px;padding:3px;flex:none}
.lang button{border:0;background:none;color:#fff;padding:4px 10px;border-radius:8px;font-size:14px;cursor:pointer}
.lang button.on{background:#fff;color:var(--brand);font-weight:700}
main{max-width:820px;margin:0 auto;padding:14px 12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;border:0;background:none;padding:10px 2px 12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:18px}
.grade-label{font-size:13px;color:var(--muted);margin:4px 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;min-width:62px;text-align:center;font-weight:700;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip small{display:block;font-weight:400;font-size:11px;opacity:.75;line-height:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=date],input[type=text],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
textarea{min-height:260px;line-height:1.8}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.red{background:var(--abs)}
.btn.sm{padding:6px 10px;font-size:14px}
.x{border:0;background:#f1e3e1;color:var(--abs);border-radius:8px;width:34px;height:38px;font-size:18px;cursor:pointer;flex:none!important}
.note{font-size:14px;color:var(--muted)}
.warn{background:var(--excbg);color:#7a5210;border-radius:10px;padding:8px 12px;font-size:14px;margin-top:8px}
.stats{display:flex;gap:8px;margin:2px 0 10px}
.stat{flex:1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}
.stat b{display:block;font-size:22px}
.stat.a b{color:var(--abs)} .stat.e b{color:var(--exc)} .stat.p b{color:var(--ok)}
.list{display:flex;flex-direction:column;gap:6px}
.stu{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;user-select:none;min-height:52px}
.stu .n{width:30px;height:30px;border-radius:50%;background:#eef2f3;display:grid;place-items:center;font-size:14px;flex:none}
.stu .nm{flex:1;font-weight:700}
.stu .tot{font-size:12px;color:var(--muted);font-weight:400}
.stu .st{font-size:13px;font-weight:700;border-radius:8px;padding:2px 10px;flex:none}
.stu.abs{background:var(--absbg);border-color:var(--abs)}
.stu.abs .n,.stu.abs .st{background:var(--abs);color:#fff}
.stu.exc{background:var(--excbg);border-color:var(--exc)}
.stu.exc .n,.stu.exc .st{background:var(--exc);color:#fff}
.saved{font-size:13px;color:var(--ok);min-height:20px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.hidden{display:none!important}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.gbox{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fafaf8}
.gbox .row{margin-bottom:8px}
.secs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sec-ed{display:flex;align-items:center;gap:2px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:2px 4px}
.sec-ed input{width:64px!important;border:0!important;padding:6px 4px!important;text-align:center;font-weight:700}
.sec-ed small{color:var(--muted);font-size:11px}
.sec-ed .mvs{border:0;background:none;color:var(--muted);font-size:11px;padding:4px 2px;cursor:pointer}
.gbox .mv{flex:0 0 34px;height:40px;border:1.5px solid var(--line);background:#fff;border-radius:10px;color:var(--brand);font-size:13px;cursor:pointer}
.sec-ed button{border:0;background:none;color:var(--abs);font-size:16px;cursor:pointer;padding:2px 4px}
.newg{border:1.5px dashed var(--brand);border-radius:12px;padding:10px;background:#f4f8f9}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
th{background:#eef2f3;font-weight:700}
td.nm{text-align:right;position:-webkit-sticky;position:sticky;right:0;background:#fff}
th.nm{position:-webkit-sticky;position:sticky;right:0}
td.A{color:var(--abs);font-weight:700} td.E{color:var(--exc);font-weight:700}
td.tot{font-weight:700}
tr.hi td{background:var(--absbg)}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#1d2a2f;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1}
.seg{display:flex;flex-wrap:wrap;background:#eef2f3;border-radius:12px;padding:4px;margin-top:10px}
.seg button{flex:1 1 22%;border:0;background:none;padding:8px 2px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer;font-size:14px;line-height:1.35}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg button[data-m="par"].on{color:#1d6b46}
:root{--par:#1d6b46;--parbg:#e8f5ee}
#tBody{--mc:var(--par);--mcbg:var(--parbg)}
.atbl td,.atbl th{font-size:13px}.atbl .x{border:0;background:none;cursor:pointer;font-size:15px}
.prog{display:inline-block;min-width:44px;border-radius:8px;padding:1px 6px;font-weight:700}
.prog.ok{background:var(--parbg);color:var(--par)}.prog.mid{background:#fff3dc;color:#8a5a00}.prog.no{background:var(--absbg);color:var(--abs)}
.gsearch{padding:10px 12px}.gsearch input{margin:0}
.gsr{display:flex;align-items:center;gap:8px;width:100%;text-align:right;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:6px;cursor:pointer;font:inherit}
.gsr .n{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#eef2f3;display:flex;align-items:center;justify-content:center;font-size:13px}
.gsr .nm{flex:1;font-weight:700}.gsr .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.gsr .gsst{font-size:12px;color:var(--muted);white-space:nowrap}.gsr .A{color:var(--abs)}.gsr .E{color:var(--exc)}.gsr .P{color:var(--par)}
.les{border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px;background:#fff}
.les .top{display:flex;align-items:center;gap:6px}
.les .n{flex:0 0 30px;height:30px;border-radius:50%;background:#eef2f3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.les input.lt{flex:1;font-weight:700;border:0!important;padding:6px 4px!important;background:transparent}
.les input.lu{width:100%;font-size:12px;border:0!important;padding:2px 4px!important;color:var(--muted);background:transparent}
.les .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.les .acts button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:5px 9px;font-size:13px;cursor:pointer}
.les .acts .att{font-size:12px;color:var(--muted);flex:1 1 100%;order:-1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.les .acts .att.ok{color:var(--par)}.les .acts .att.miss{color:var(--abs)}
.les .acts button.op{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.lsrc{margin-top:10px;padding:10px;border:1.5px dashed #9cc4d2;border-radius:12px;background:#f4f9fb}.lsrc .btn{margin:0 0 6px 6px}
.unit-h{font-family:inherit;font-weight:700;color:var(--brand);margin:12px 2px 6px;font-size:14px}
.tles{margin-top:10px;padding:8px 10px;border:1.5px solid #cfe3ea;border-radius:12px;background:#f4f9fb}
.tles .ln{font-weight:700}.tles .row2{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.tles select{flex:1;min-width:150px;padding:6px 8px}.tles button{flex:0 0 auto}
.lprog td.d{color:var(--par);font-weight:700;cursor:pointer}.lprog td.e{cursor:pointer;color:#c7d0d3}
.stu.ps{flex-wrap:wrap}.psrow{flex-basis:100%;display:flex;gap:5px;align-items:center;padding-inline-start:38px;margin-top:4px}
.psb{flex:1;max-width:46px;height:36px;border-radius:9px;border:1.5px solid var(--line);font-weight:800;font-size:17px;cursor:pointer;background:#eef2f3;color:var(--muted)}
.psdef{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:13px}.psdef .seg{margin:0}.psdef .seg button{padding:6px 10px;font-size:13px;white-space:nowrap}.psb.psA.d5{background:#fffaf0;color:#dcb877;border-color:#f3e6c6}.psb.psA.d0{background:#fdf5f4;color:#e3a69d;border-color:#f3dcd8}
.psb.psA{background:#f3f8f5;color:#9cc8ad;border-color:#dcebe2;font-weight:600}.psb.psY{background:var(--par);color:#fff;border-color:var(--par)}.psb.pq5{background:#fff3dc;color:#b7791f;border-color:#f0d9a4}.psb.pq0{background:var(--absbg);color:var(--abs);border-color:#f0c2bb}
.psv{margin-inline-start:auto;min-width:40px;text-align:center;font-size:17px;color:var(--par)}.psv.lo{color:var(--abs)}
.pqb{flex:0 0 auto;min-width:44px;text-align:center;font-weight:800;font-size:18px;border-radius:10px;padding:4px 8px;background:#eef2f3;color:var(--muted)}
.pqb.pq1{background:var(--parbg);color:var(--par)}.pqb.pq5{background:#fff3dc;color:#b7791f}.pqb.pq0{background:var(--absbg);color:var(--abs)}
.tquiz{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border:1.5px dashed var(--line);border-radius:12px}
.tquiz.on{border-style:solid;border-color:#b7791f;background:#fff8e6}
.tquiz .chk{margin:0;flex:1}.tquiz select{flex:0 0 auto;width:auto;padding:6px 8px}
.tt td .qz{display:block;font-size:10px;font-weight:700;color:#b7791f}
#tBody.mk-clean{--mc:#8d5b2a;--mcbg:#f7efe6}
#tBody.mk-noise{--mc:#6b3fa0;--mcbg:#f1ebf8}
#tBody.mk-neg{--mc:#a0453a;--mcbg:#fbecea}
.sub-ed{border:1px solid #e3e8ea;border-radius:10px;padding:8px;margin-bottom:8px}.sub-ed select{margin-top:6px}
.trk{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid #eef2f3}
.trk input[type=checkbox]{width:22px;height:22px;flex:0 0 auto}
.trk .tn{flex:1;font-weight:700}.trk .ck{width:22px;text-align:center;color:var(--brand);font-weight:700}.trk small{color:var(--muted);font-weight:400}
.seg button[data-m="clean"].on{color:#8d5b2a}
.seg button[data-m="noise"].on{color:#6b3fa0}
.stu.has{background:var(--mcbg);border-color:var(--mc)}
.stu.has .n{background:var(--mc);color:#fff}
.stu .pc{font-weight:700;color:var(--mc);font-size:14px;min-width:44px;text-align:center;flex:none}
.stu .minus{border:1.5px solid var(--line);background:#fff;border-radius:8px;width:38px;height:38px;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;flex:none}
.stu.dis{opacity:.45;cursor:not-allowed}
.stu.dis .pc{color:var(--abs);font-size:12px}
.stat.g b{color:var(--mc)}
tr.lo td{background:#fff8e6}
td.P{color:var(--par);font-weight:700}
.credit .cpy{font-size:11px;opacity:.85;margin-top:4px}
.credit{text-align:center;font-size:12.5px;color:var(--muted);padding:4px 16px 14px;line-height:1.7}
.credit b{color:var(--brand)}
.print-head{display:none}
.gin{width:76px!important;flex:none;text-align:center;font-weight:700;font-size:18px;padding:8px 4px!important;direction:ltr}
.gin.bad{border-color:var(--abs)!important;background:var(--absbg)!important}
.gin.ok{border-color:#9cc4d2!important;background:#f4f9fb!important}
.stu.ev{flex-wrap:wrap}
#rType{flex-wrap:wrap}#rType button{flex:1 1 30%}
.evrow{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-inline-start:40px}
.eb{background:#eef2f3;border-radius:8px;padding:3px 8px;font-size:13px;white-space:nowrap}
.eb b{font-size:15px}.eb.lo{background:var(--absbg);color:var(--abs)}
.evrow .gin{width:58px!important;font-size:16px;padding:6px 2px!important}
.gabs{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.gabs.on{background:var(--absbg);border-color:var(--abs);color:var(--abs)}
.gin.abs{color:var(--abs)!important;font-weight:700;background:var(--absbg)!important}
.evrow .gin.cur{border-color:var(--brand)!important;box-shadow:0 0 0 2px rgba(31,78,95,.18)}
.eb.jd{border:1.5px solid #9cc4d2;cursor:pointer;font:inherit;font-size:13px}.eb.jd.lo{border-color:var(--abs)}
.eb.man{background:#f4f9fb;border:1px dashed #9cc4d2}
.evrow .ql{font-size:12px;color:var(--muted)}
.evt{font-weight:700;color:var(--brand);margin-inline-start:auto;white-space:nowrap}
.pered{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.stu.gr{cursor:default}
.vobar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.vobtn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.qcv{font-size:12px;color:var(--brand);font-weight:700;white-space:nowrap;direction:ltr}
.gin.multi{width:150px!important;border-color:#c8a24a!important;background:#fffaf0}
.stu.vocur{outline:3px solid #c8a24a;outline-offset:-1px;background:#fffaf0}
#voPanel{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#10303a;color:#fff;padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.3)}
#voPanel .vn{font-size:20px;font-weight:700;line-height:1.5}
#voPanel .vh{font-size:15px;color:#e6cf8f;min-height:22px;margin:2px 0 8px}
#voPanel .va{display:flex;flex-wrap:wrap;gap:6px}
#voPanel .va button{flex:1 1 auto;min-width:70px;border:0;border-radius:10px;padding:10px 8px;font:inherit;font-weight:700;background:#fff;color:#10303a;cursor:pointer}
#voPanel .va button.stop{background:#b8392b;color:#fff}
#voPanel .mic{display:inline-block;width:12px;height:12px;border-radius:50%;background:#e05a47;margin-inline-end:6px;animation:vop 1s infinite}
@keyframes vop{50%{opacity:.25}}
#voPanel select{width:auto!important;flex:1 1 auto;padding:8px;border-radius:10px;font:inherit;font-size:15px;color:#10303a!important;background:#fff!important;border:0}
.sheet{font-size:13px}
.sheet th,.sheet td{padding:3px 4px}
.sheet th.blue{background:#cfeaf3}
.sheet th.beige{background:#fff3dc}
.sheet td.b{font-weight:700}
.sheet td.nm{font-weight:700}
.sheet.off th.v{height:190px;padding:2px;vertical-align:middle}
.sheet.off th.v span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:12px;display:inline-block}
.sheet.off th.blue,.sheet.off td.blue{background:#7ccce4}.sheet.off td.pink{background:#f8c8d0}.sheet.off th.beige{background:#ffe8b9}
.sheet.off td.nm{text-align:right;min-width:150px}
.sheet-head .yel{background:#ffc000;padding:1px 10px;border-radius:3px}
.sheet-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;font-weight:700;margin-bottom:8px}
.gprint{display:none}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.chk input{width:22px;height:22px}
.comp-ed{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.comp-ed .cn{flex:1}
.comp-ed .cm{width:70px!important;flex:none;text-align:center}
.print-credit{display:none}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(20,30,35,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal .box{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal .msg{margin-bottom:14px;line-height:1.8;white-space:pre-line}
.modal .box input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:20px;text-align:center;letter-spacing:6px;margin-bottom:14px;direction:ltr}
.lockbar{display:flex;align-items:center;gap:8px;justify-content:space-between;border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:14px;font-weight:700;background:#eef2f3;color:var(--brand)}
.lockbar.open{background:#fff8e6;color:#7a5210}
.lockbar button{flex:none}
[data-lockarea] [disabled],[data-lockel][disabled]{opacity:.55;cursor:not-allowed}
label.btn.dim{opacity:.55;pointer-events:none}
.modal .acts{display:flex;gap:8px;justify-content:flex-start}
.modal.err .msg{color:var(--abs)}
/* ---- weekly timetable ---- */
.tt{table-layout:fixed;width:100%;min-width:340px}
.tt th,.tt td{border:1.5px solid #d78a92;white-space:normal;padding:2px}
.tt thead th{background:#fff;color:var(--muted);height:32px;font-size:15px}
.tt th.d{width:72px;background:#fff;color:var(--brand);font-size:13px;line-height:1.3;padding:4px 2px}
.tt tr.today th.d{background:#e6f0f3}
.tt td{height:68px;cursor:pointer;vertical-align:middle}
.tt td .g{display:block;font-size:11px;color:var(--muted);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt td .l{display:block;font-size:17px;font-size:clamp(14px,4.3vw,20px);font-weight:700;line-height:1.3;direction:ltr;white-space:nowrap}
.tt td .tm{display:block;font-size:10px;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums;line-height:1.2}
.tt td.e .tm{opacity:.45}
.tt.np7 td .l,.tt.np8 td .l{font-size:15px;font-size:clamp(12px,3.4vw,18px)}.tt.np8 td .l{font-size:14px;font-size:clamp(11px,3vw,17px)}
.tt.np7 th.d,.tt.np8 th.d{width:58px;font-size:12px}.tt.np8 td .tm{font-size:9px}
.tt td.now{background:var(--parbg);box-shadow:inset 0 0 0 2px var(--par)}
.tt td.soon{box-shadow:inset 0 0 0 2px var(--exc)}
.shf{display:block;margin:3px auto 0;border:1px solid currentColor;border-radius:999px;font-size:11px;padding:0 8px;cursor:pointer;line-height:1.6}
.shf.m{color:#a85d0b;background:#fdf1e1}
.shf.e{color:#4a3ea8;background:#ecebfb}
.ttnow{display:flex;gap:10px;align-items:center;background:#eef2f3;border-radius:12px;padding:8px 12px;margin-bottom:10px}
.ttnow.live{background:var(--parbg);color:#14523a}
.ttnow .tx{flex:1;min-width:0;font-size:13px;line-height:1.5}
.ttnow .tx b{display:block;font-size:15px}
.ttnow .btn{flex:none}
.ttset{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.ttset .chk{font-weight:400;font-size:14px;grid-column:1/-1}
.btn.on{background:var(--ok)}
@page sheetp{size:A4 portrait;margin:8mm}
@page wide{size:A4 landscape;margin:10mm}
@page imgp{size:A4 portrait;margin:0}
@page imgl{size:A4 landscape;margin:0}
#pimgBox{display:none}
@media print{
  body.printimg>*:not(#pimgBox){display:none!important}
  body.printimg #pimgBox{display:block;page:imgp}
  body.printimg #pimgBox.land{page:imgl}
  body.printimg #pimg{display:block;width:100%;height:auto;max-height:296mm;object-fit:contain}
  body.printimg #pimgBox.land #pimg{max-height:209mm}
}
@media print{
  @page{size:A4 portrait;margin:12mm}
  #rOut.wide,#v-tt{page:wide}
  #rOut table{font-size:11px}
  #rOut th{background:#eef2f3!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #rOut tr.hi td{background:#fdecea!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #rOut tr{break-inside:avoid}
  #rOut h3{font-size:13px;margin:8px 0 4px}
  #v-gr .card,#gBody{display:none!important}
  .gsec{break-inside:avoid}
  .gprint{display:block;page:sheetp}
  .gprint .sheet{font-size:10px}
  .gprint .sheet th.blue,.gprint .sheet th.beige{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;padding:0;font-size:11px}
  header,nav,.noprint,.toast{display:none!important}
  main{max-width:none;padding:0}
  .card{border:0;padding:0;margin:0}
  .print-head{display:block;text-align:center;margin-bottom:6px}
  .print-credit{display:block;text-align:center;font-size:9px;color:#555;margin-top:6px}
  tr.lo td{background:none}
  .print-head h2{margin:0;font-size:16px}
  .tblwrap{overflow:visible;border:0}
  table{font-size:10px}
  th,td{padding:2px 3px;border:1px solid #555}
  td.nm,th.nm{position:static}
  tr.hi td{background:none}
  .tt th,.tt td{border:1.5px solid #d78a92!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tt td{height:72px}.tt td .l{font-size:18px}.tt td .g,.tt td .tm{font-size:10px}.tt th.d{font-size:12px}
}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad(n){return(n<10?"0":"")+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fmtD(s){var d=parseD(s);return L().days[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear()}
function shortD(s){var d=parseD(s);return d.getDate()+"/"+(d.getMonth()+1)}
function toast(m){var el=$("toast");el.textContent=m;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("show")},1700)}

/* ================= data ================= */
/* D = {v:2, grades:[{id,name}], sections:[{id,gradeId,label,students:[{id,name}]}], records:{"secId|date":{stuId:"A"|"E"}}, info, ui} */
var D;
function defaults(lang){return{v:2,info:{teacher:"",subject:"",school:""},grades:[],sections:[],records:{},part:{},clean:{},noise:{},gb:{},track:{par:true,clean:true,noise:true},custom:[],ui:{sec:null,lang:lang||"ar",mode:"att"}}}
function migrate(x){
  if(!x.grades){ // v1: sections had numeric grade + full name
    x.grades=[];var map={};
    (x.sections||[]).forEach(function(s){
      var g=s.grade;if(!map[g]){map[g]="g"+g;x.grades.push({id:map[g],name:(g===11?"الصف الحادي عشر":g===12?"الصف الثاني عشر":"الصف "+g)})}
      s.gradeId=map[g];s.label=String(s.name||"").replace(/^\d+\s*/,"")||s.name;delete s.grade;delete s.name;
    });
    x.v=2;
  }
  delete x.locks;x.ps=x.ps||{};x.judge=x.judge||{};x.pq=x.pq||{};x.qinfo=x.qinfo||{};x.lessons=x.lessons||{};x.taught=x.taught||{};x.records=x.records||{};x.part=x.part||{};x.clean=x.clean||{};x.noise=x.noise||{};x.gb=x.gb||{};x.track=x.track||{par:true,clean:true,noise:true};x.custom=x.custom||[];x.custom.forEach(function(c){x["cx_"+c.id]=x["cx_"+c.id]||{}});x.info=x.info||{teacher:"",subject:"",school:""};x.ui=x.ui||{};x.ui.lang=x.ui.lang||"ar";x.ui.mode=x.ui.mode||"att";
  return x;
}
function load(){try{var raw=localStorage.getItem(KEY);D=raw?migrate(JSON.parse(raw)):defaults()}catch(e){D=defaults()}}
var SAVEV=0,SWAP=0;function save(){if(SWAP)return true;SAVEV++;try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){toast(t("saveFail"));return false}}
function grade(id){for(var i=0;i<D.grades.length;i++)if(D.grades[i].id===id)return D.grades[i];return{name:""}}
function sec(id){for(var i=0;i<D.sections.length;i++)if(D.sections[i].id===id)return D.sections[i];return D.sections[0]}
function secsOf(gid){return D.sections.filter(function(s){return s.gradeId===gid})}
function fullName(s){return(gTitle(grade(s.gradeId))+" "+s.label).trim()}
function rk(secId,date){return secId+"|"+date}
function recordsOf(secId,store){
  store=store||D.records;
  var out=[];for(var k in store){var p=k.split("|");if(p[0]===secId)out.push({date:p[1],m:store[k]})}
  out.sort(function(a,b){return a.date<b.date?-1:1});return out;
}
var MK={
  par:{store:"part",kind:"count",icon:"⭐",help:"parHelp",tot:"nPar",clear:"clearPar",title:"repTitlePar",col:"colPar",row:"parCount",shade:"shadedPar",empty:"noParLessons",low:true,stats:["participants","participations","notYet"]},
  clean:{store:"clean",kind:"toggle",icon:"🧹",help:"cleanHelp",tot:"nClean",clear:"clearClean",title:"repTitleClean",col:"colClean",row:"rowClean",shade:"shadedMark",empty:"noMarks",stats:["notClean","cleanOk"]},
  noise:{store:"noise",kind:"count",icon:"🤫",help:"noiseHelp",tot:"nNoise",clear:"clearNoise",title:"repTitleNoise",col:"colNoise",row:"rowNoise",shade:"shadedMark",empty:"noMarks",stats:["violators","violations","committed"]}
};
function markTotals(secId,store){
  var r={};recordsOf(secId,D[store]).forEach(function(x){for(var s in x.m)r[s]=(r[s]||0)+x.m[s]});return r;
}
function totals(secId){
  var r={};recordsOf(secId).forEach(function(x){for(var s in x.m){r[s]=r[s]||{A:0,E:0};if(x.m[s]==="A")r[s].A++;else if(x.m[s]==="E")r[s].E++}});return r;
}
function ensureSel(){if(!D.sections.length){D.ui.sec=null;return}if(!D.ui.sec||!D.sections.some(function(s){return s.id===D.ui.sec}))D.ui.sec=D.sections[0].id}

/* ================= language ================= */
function trkOn(m){return!!(D.track&&D.track[m])}
var KINDS={pos:{kind:"count",low:true},neg:{kind:"count",low:false},once:{kind:"toggle",low:false}};
function buildMK(){
  Object.keys(MK).forEach(function(k){if(k.charAt(0)==="x")delete MK[k]});
  (D.custom||[]).forEach(function(c){
    var K=KINDS[c.type]||KINDS.pos,nm=c.name,ic=c.icon||(c.type==="pos"?"⭐":c.type==="neg"?"⚠️":"✓");
    D["cx_"+c.id]=D["cx_"+c.id]||{};
    MK["x"+c.id]={custom:1,neg:c.type!=="pos",store:"cx_"+c.id,kind:K.kind,low:K.low,icon:ic,label:ic+" "+nm,
      help:t(K.kind==="toggle"?"cxHelpOnce":"cxHelpCount",{x:nm}),tot:"{n}",clear:t("cxClear",{x:nm}),
      title:t("cxTitle",{x:nm}),col:t("cxCol",{x:nm}),row:t("cxRow",{x:nm}),shade:t(K.low?"cxShadeLow":"cxShadeHi"),empty:t("cxEmpty",{x:nm}),badge:nm,
      stats:K.kind==="toggle"?[t("cxMarked"),t("cxNotMarked")]:[t("cxWho"),t("cxSum"),t("cxNone")]};
  });
}
function modeList(){var l=[["att",t("modeAtt")]];
  [["par","modePar"],["clean","modeClean"],["noise","modeNoise"]].forEach(function(m){if(trkOn(m[0]))l.push([m[0],t(m[1])])});
  Object.keys(MK).forEach(function(k){if(MK[k].custom)l.push([k,MK[k].label])});return l}
function renderModeBtns(){
  buildMK();var l=modeList(),ok={};l.forEach(function(m){ok[m[0]]=1});
  if(!ok[D.ui.mode])D.ui.mode="att";
  if(D.ui.rtype&&!ok[D.ui.rtype]&&D.ui.rtype!=="grade"&&D.ui.rtype!=="ev")D.ui.rtype="att";
  function btns(x){return x.map(function(m){return'<button data-m="'+m[0]+'">'+esc(m[1])+"</button>"}).join("")}
  $("tMode").innerHTML=btns(l);
  $("tMode").style.display=l.length>1?"":"none";
  $("rType").innerHTML=btns(l.concat([["grade",t("modeGrade")],["ev",t("modeEv")]]));
}
function applyLang(){
  var lang=D.ui.lang;document.documentElement.lang=lang==="ku"?"ckb":"ar";
  [].forEach.call(document.querySelectorAll("[data-i]"),function(el){el.innerHTML=t(el.dataset.i)});
  [].forEach.call(document.querySelectorAll(".lang button"),function(b){b.classList.toggle("on",b.dataset.l===lang)});
  $("sNames").placeholder=t("namesPh");$("ngName").placeholder=t("classPh");$("gsQ").placeholder=t("gsPh");
  renderModeBtns();if($("trkBox"))renderTrk();
  hdr();
}
document.querySelector(".lang").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;D.ui.lang=b.dataset.l;save();applyLang();show(cur);
});
function subjects(){var i=D.info;if(!Array.isArray(i.subjects))i.subjects=i.subject?[i.subject]:[];i.subject=i.subjects[0]||"";return i.subjects}
function gSubj(g){var l=subjects();return(g&&g.subj&&l.indexOf(g.subj)>=0)?g.subj:(l[0]||"")}
function gTitle(g){var dup=D.grades.some(function(x){return x!==g&&x.name.trim()===g.name.trim()});return dup&&gSubj(g)?g.name+" — "+gSubj(g):g.name}
function subjOpts(v){return subjects().map(function(x){return'<option'+(x===v?" selected":"")+">"+esc(x)+"</option>"}).join("")}
function subjCtl(g){if(subjects().length<2)return"";
  return'<div class="row" style="margin-bottom:8px"><div><label class="f">'+t("gSubjL")+'</label><select class="gsubj">'+subjOpts(gSubj(g))+'</select></div>'+
    '<button class="btn ghost sm" data-dup="'+g.id+'" style="flex:0 0 auto;align-self:flex-end">'+t("dupClass")+"</button></div>"}
function renderSubj(){var l=subjects();
  $("subjChips").innerHTML=l.map(function(x,i){return'<span class="sec-ed" style="padding:4px 10px"><b>'+esc(x)+'</b>'+(i===0?' <small>'+t("defSubj")+"</small>":"")+'<button data-dsub="'+i+'">✕</button></span>'}).join("");
  $("cSubject").placeholder=t(l.length?"subjPh2":"subjPh");}
function dupClass(gid){
  var g=grade(gid),l=subjects(),used={};D.grades.forEach(function(x){if(x.name.trim()===g.name.trim())used[gSubj(x)]=1});
  var sj=l.filter(function(x){return!used[x]})[0]||l[0],ng={id:"g"+uid(),name:g.name,subj:sj};
  D.grades.splice(D.grades.indexOf(g)+1,0,ng);
  secsOf(g.id).forEach(function(s0){D.sections.push({id:"s"+uid(),gradeId:ng.id,label:s0.label,students:s0.students.map(function(x){return{id:uid(),name:x.name}})})});
  sortSections();save();renderClasses();hdr();toast(t("dupDone",{g:g.name,s:sj}));
}
function renderTrk(){
  var h='<div class="trk"><span class="ck">✓</span><span class="tn">'+esc(t("modeAtt"))+' <small>'+t("trkAlways")+"</small></span></div>";
  [["par","modePar"],["clean","modeClean"],["noise","modeNoise"]].forEach(function(m){
    h+='<label class="trk"><input type="checkbox" data-trk="'+m[0]+'"'+(trkOn(m[0])?" checked":"")+'><span class="tn">'+esc(t(m[1]))+"</span></label>"});
  (D.custom||[]).forEach(function(c){var cfg=MK["x"+c.id];
    h+='<div class="trk"><span class="ck">✓</span><span class="tn">'+esc(cfg?cfg.label:c.name)+' <small>'+t("cxT_"+c.type)+'</small></span><button class="x" data-cxdel="'+c.id+'">🗑</button></div>'});
  $("trkBox").innerHTML=h;
  $("cxName").placeholder=t("cxNamePh");$("cxIcon").placeholder="🙂";
  $("cxType").innerHTML=["pos","neg","once"].map(function(k){return'<option value="'+k+'">'+esc(t("cxT_"+k))+"</option>"}).join("");
}
$("trkBox").addEventListener("change",function(e){var m=e.target.dataset.trk;if(!m)return;D.track[m]=e.target.checked;save();renderModeBtns();renderTrk()});
$("trkBox").addEventListener("click",function(e){var b=e.target.closest("[data-cxdel]");if(!b)return;var id=b.dataset.cxdel,c=D.custom.filter(function(x){return x.id===id})[0];
  ask(t("cxDelQ",{x:c.name}),function(){D.custom=D.custom.filter(function(x){return x.id!==id});delete D["cx_"+id];save();renderModeBtns();renderTrk()})});
$("cxAdd").onclick=function(){var nm=$("cxName").value.trim();if(!nm){$("cxName").focus();return}
  D.custom.push({id:uid(),name:nm,icon:$("cxIcon").value.trim(),type:$("cxType").value});
  $("cxName").value="";$("cxIcon").value="";save();renderModeBtns();renderTrk();toast(t("cxAdded",{x:nm}))};
$("subjAdd").onclick=function(){var v=$("cSubject").value.trim();if(!v){$("cSubject").focus();return}var l=subjects();
  if(l.indexOf(v)<0)l.push(v);D.info.subject=l[0];$("cSubject").value="";save();renderSubj();renderClasses();hdr()};
$("cSubject").addEventListener("keydown",function(e){if(e.key==="Enter")$("subjAdd").click()});
$("subjChips").addEventListener("click",function(e){var b=e.target.closest("[data-dsub]");if(!b)return;var l=subjects(),x=l[+b.dataset.dsub];
  ask(t("delSubj",{s:x}),function(){l.splice(+b.dataset.dsub,1);D.info.subject=l[0]||"";D.grades.forEach(function(g){if(g.subj===x)g.subj=""});save();renderSubj();renderClasses();hdr()})});
function subjOf(s){return s?gSubj(grade(s.gradeId)):String(D.info.subject||"")}
function allSubj(){var seen={},o=[];D.grades.map(gSubj).concat(D.grades.length?[]:subjects()).forEach(function(x){x=String(x||"").trim();if(x&&!seen[x]){seen[x]=1;o.push(x)}});return o.join("، ")}
function hdr(){
  var p=[allSubj(),D.info.teacher,D.info.school].filter(Boolean);
  $("hdrSub").textContent=p.join(" — ")||t("hint");
}

/* ================= section pickers ================= */
function fillSelect(el,val){
  el.innerHTML=D.grades.map(function(g){
    var ss=secsOf(g.id);if(!ss.length)return"";
    return'<optgroup label="'+esc(gTitle(g))+'">'+ss.map(function(s){
      return'<option value="'+s.id+'"'+(s.id===val?" selected":"")+'>'+esc(fullName(s))+" ("+s.students.length+" "+t("students")+")</option>"}).join("")+"</optgroup>";
  }).join("");
}
function picker(){
  var h="";
  D.grades.forEach(function(g){
    var ss=secsOf(g.id);if(!ss.length)return;
    h+='<div class="grade-label">'+esc(gTitle(g))+'</div><div class="chips">';
    ss.forEach(function(s){h+='<button class="chip'+(s.id===D.ui.sec?" on":"")+'" data-s="'+s.id+'">'+esc(s.label)+'<small>'+s.students.length+'</small></button>'});
    h+="</div>";
  });
  $("secPicker").innerHTML=h;
}
$("secPicker").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;D.ui.sec=b.dataset.s;save();picker();renderTake()});

/* ================= TAKE ================= */
var filterTxt="";
/* ---- search a student across every class and section ---- */
function gsRun(){
  var q=normName($("gsQ").value||""),box=$("gsRes");
  if(q.length<2){box.innerHTML="";return}
  var out=[];
  D.sections.forEach(function(sc){sc.students.forEach(function(st,i){if(normName(st.name).indexOf(q)>=0)out.push({s:sc,st:st,i:i})})});
  if(!out.length){box.innerHTML='<div class="note" style="margin-top:8px">'+t("gsNone")+"</div>";return}
  var tots={},pars={};
  box.innerHTML='<div class="note" style="margin:8px 2px 4px">'+t("gsN",{n:out.length})+"</div>"+out.slice(0,40).map(function(r){
    var T=tots[r.s.id]||(tots[r.s.id]=totals(r.s.id)),P=pars[r.s.id]||(pars[r.s.id]=markTotals(r.s.id,"part")),x=T[r.st.id]||{A:0,E:0},p=P[r.st.id]||0;
    return'<button class="gsr" data-gs="'+r.s.id+'" data-name="'+esc(r.st.name)+'"><span class="n">'+(r.i+1)+'</span><span class="nm">'+esc(r.st.name)+
      '<small>'+esc(fullName(r.s))+(subjOf(r.s)?" — "+esc(subjOf(r.s)):"")+"</small></span>"+
      '<span class="gsst"><b class="A">'+x.A+"</b> "+t("gsAbs")+(x.E?' · <b class="E">'+x.E+"</b> "+t("gsExc"):"")+(trkOn("par")?' · <b class="P">'+p+"</b> ⭐":"")+"</span></button>"}).join("")+
    (out.length>40?'<div class="note">'+t("gsMore")+"</div>":"");
}
$("gsQ").addEventListener("input",gsRun);
$("gsRes").addEventListener("click",function(e){var b=e.target.closest("[data-gs]");if(!b)return;
  D.ui.sec=b.dataset.gs;D.ui.mode="att";filterTxt=b.dataset.name;$("gsQ").value="";$("gsRes").innerHTML="";save();renderTake();
  setTimeout(function(){var el=$("tBody");if(el&&el.scrollIntoView)el.scrollIntoView({behavior:"smooth",block:"start"})},50)});
function renderTake(){
  ensureSel();
  var none=!D.sections.length;
  $("tSetup").classList.toggle("hidden",!none);$("tMain").classList.toggle("hidden",none);
  if(none)return;
  ttTakeBanner();picker();
  var s=sec(D.ui.sec),date=$("tDate").value,wd=parseD(date).getDay();
  renderTQuiz(s,date);renderTLesson(s,date);
  $("tWarn").innerHTML=(wd===5||wd===6)?'<div class="warn">'+t("holiday",{d:L().days[wd]})+"</div>":"";
  if(!s.students.length){
    $("tBody").innerHTML='<div class="card empty">'+t("noStudents",{s:esc(fullName(s))})+'<br><br><button class="btn" id="goStu">'+t("addNames")+"</button></div>";
    $("goStu").onclick=function(){show("stu");$("sSec").value=s.id;loadNames()};return;
  }
  [].forEach.call($("tMode").children,function(b){b.classList.toggle("on",b.dataset.m===D.ui.mode)});
  // الحضور تلقائي: فتح الشعبة اليوم (يوم دوام) يسجّل الدرس والجميع حاضرون
  if(date===ymd(new Date())&&wd<5&&!D.records[rk(s.id,date)]){D.records[rk(s.id,date)]={};save()}
  $("tBody").className=MK[D.ui.mode]?(MK[D.ui.mode].custom?(MK[D.ui.mode].neg?"mk-neg":"mk-par"):"mk-"+D.ui.mode):"";
  if(D.ui.mode==="par"){renderPS(s,date);return}
  if(MK[D.ui.mode]){renderMark(s,date,MK[D.ui.mode]);if(D.ui.mode==="par")$("tBody").insertAdjacentHTML("afterbegin",pqSwitch());return}
  var m=D.records[rk(s.id,date)]||{},tot=totals(s.id),a=0,ex=0;
  s.students.forEach(function(st){if(m[st.id]==="A")a++;else if(m[st.id]==="E")ex++});
  var started=!!D.records[rk(s.id,date)];
  var h='<div class="stats"><div class="stat p"><b>'+(s.students.length-a-ex)+"</b>"+t("present")+'</div><div class="stat a"><b>'+a+"</b>"+t("absent")+'</div><div class="stat e"><b>'+ex+"</b>"+t("excused")+"</div></div>";
  h+='<div class="note" style="margin-bottom:8px">'+t("tapHelp")+"</div>";
  h+='<input type="text" id="tFilter" placeholder="'+esc(t("search"))+'" value="'+esc(filterTxt)+'" style="margin-bottom:8px"><div class="list">';
  s.students.forEach(function(st,i){
    if(filterTxt&&st.name.indexOf(filterTxt)<0)return;
    var v=m[st.id],cls=v==="A"?" abs":v==="E"?" exc":"",tt=tot[st.id];
    var tl=tt?[tt.A?t("nAbs",{n:tt.A}):"",tt.E?t("nExc",{n:tt.E}):""].filter(Boolean).join(" ، "):"";
    h+='<div class="stu'+cls+'" data-id="'+st.id+'"><span class="n">'+(i+1)+'</span><span class="nm">'+esc(st.name)+
       (tl?'<div class="tot">'+t("total")+tl+"</div>":"")+"</span>"+(v?'<span class="st">'+t(v==="A"?"absent":"excused")+"</span>":"")+"</div>";
  });
  h+='</div><div class="toolbar"><button class="btn" id="tShare">'+t("share")+"</button>"+
     (started?'<button class="btn ghost" id="tClear">'+t("clearDay")+"</button>":'<button class="btn ghost" id="tAllP">'+t("allPresent")+"</button>")+
     '</div><div class="saved">'+(started?t("autoSaved",{d:fmtD(date)}):"")+"</div>";
  $("tBody").innerHTML=h;
  $("tFilter").oninput=function(){filterTxt=this.value.trim();var p=this.selectionStart;renderTake();var f=$("tFilter");f.focus();f.setSelectionRange(p,p)};
  $("tShare").onclick=function(){shareAbs(s,date)};
  if($("tClear"))$("tClear").onclick=function(){ask(t("confirmClear",{s:fullName(s),d:fmtD(date)}),function(){delete D.records[rk(s.id,date)];save();renderTake()})};
  if($("tAllP"))$("tAllP").onclick=function(){D.records[rk(s.id,date)]={};save();renderTake();toast(t("markedAll"))};
}
$("tBody").addEventListener("click",function(e){
  if(D.ui.mode==="par")return;
  var row=e.target.closest(".stu");if(!row)return;
  var s=sec(D.ui.sec),k=rk(s.id,$("tDate").value),id=row.dataset.id;
  var cfg=MK[D.ui.mode];
  if(cfg){
    var att=D.records[k]||(D.records[k]={});
    if(att[id]==="A"){toast(t("stuAbsent"));return}
    var store=D[cfg.store],p=store[k]||(store[k]={});
    if(cfg.kind==="toggle"){if(p[id])delete p[id];else p[id]=1}
    else if(e.target.closest(".minus")){if(p[id])p[id]--;if(!p[id])delete p[id]}else p[id]=(p[id]||0)+1;
    if(!Object.keys(p).length)delete store[k];
    save();renderTake();return;
  }
  var m=D.records[k]||(D.records[k]={});
  m[id]=!m[id]?"A":m[id]==="A"?"E":undefined;if(!m[id])delete m[id];
  save();renderTake();
});
$("tMode").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;D.ui.mode=b.dataset.m;filterTxt="";save();renderTake()});

function renderMark(s,date,cfg){
  var k=rk(s.id,date),att=D.records[k]||{},store=D[cfg.store],p=store[k]||{},tot=markTotals(s.id,cfg.store),who=0,sum=0,ab=0;
  s.students.forEach(function(st){if(p[st.id]){who++;sum+=p[st.id]}if(att[st.id]==="A")ab++});
  var vals=cfg.kind==="toggle"?[who,s.students.length-who-ab]:[who,sum,s.students.length-who-ab];
  var h='<div class="stats">'+vals.map(function(v,i){return'<div class="stat'+(i<vals.length-1||cfg.kind==="toggle"&&i===0?" g":"")+'"><b>'+v+"</b>"+t(cfg.stats[i])+"</div>"}).join("")+"</div>";
  h+='<div class="note" style="margin-bottom:8px">'+t(cfg.help)+"</div>";
  h+='<input type="text" id="tFilter" placeholder="'+esc(t("search"))+'" value="'+esc(filterTxt)+'" style="margin-bottom:8px"><div class="list">';
  s.students.forEach(function(st,i){

/* names → students, keeping every existing student's id (and so his grades, absences and marks):
   exact name, then the same name with spelling variants, then a close spelling, then the same line (an edited name);
   removed students are archived so typing the name again brings their records back */
function lev(a,b){if(a===b)return 0;var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=n;i++)d[i]=i;
  for(i=1;i<=m;i++){var prev=d[0];d[0]=i;for(j=1;j<=n;j++){var tmp=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=tmp}}return d[n]}

    .filter(function(n){if(!n||seen[n])return false;seen[n]=1;return true});
  var old=s.students.slice(),gone=(s.gone||[]).slice(),used={},res=names.map(function(n){return{name:n,id:null,from:null}});
  function take(r,o,kind){r.id=o.id;r.kind=kind;r.from=o.name;used[o.id]=1}
  res.forEach(function(r){var o=old.filter(function(x){return!used[x.id]&&x.name===r.name})[0];if(o)take(r,o,"same")});
  res.forEach(function(r){if(r.id)return;var k=normName(r.name),o=old.filter(function(x){return!used[x.id]&&normName(x.name)===k})[0];if(o)take(r,o,"ren")});
  res.forEach(function(r){if(r.id)return;var k=normName(r.name),g=gone.filter(function(x){return!used[x.id]&&normName(x.name)===k})[0];if(g)take(r,g,"back")});
  res.forEach(function(r){if(r.id)return;var k=normName(r.name),best=null,bd=1e9;
    old.forEach(function(x){if(used[x.id])return;var kk=normName(x.name),d=lev(k,kk);if(d<bd&&d<=Math.max(2,Math.floor(Math.max(k.length,kk.length)*0.25))){bd=d;best=x}});
    if(best)take(r,best,"ren")});
  res.forEach(function(r,i){if(r.id)return;var o=old[i];if(o&&!used[o.id]&&!names.some(function(n){return n===o.name}))take(r,o,"ren")});

  var prev={};s.students.concat(s.gone||[]).forEach(function(x){prev[x.id]=x});
  s.students=p.res.map(function(r){var o=prev[r.id],n={id:r.id,name:r.name};if(o&&o.from){n.from=o.from;n.fdate=o.fdate}return n});
}

function collectBlocks(root){
  var out=[];
  (function walk(el,center){
    [].forEach.call(el.childNodes,function(n){
      if(n.nodeType===3){var x=n.textContent.trim();if(x)out.push({k:"p",t:x,center:center});return}

      if(n.tagName==="H2"){out.push({k:"h2",t:nodeText(n)});return}

      if(cl.contains("print-credit"))return;

      var leaf=[].every.call(n.children,function(c){return INL[c.tagName]});
      if(leaf){var x=nodeText(n);if(x)out.push({k:"p",t:x,center:center||cl.contains("print-head"),warn:cl.contains("warn")});return}
      walk(n,center||cl.contains("print-head"));
    });
  })(root,false);

  var file=null;try{file=new File([blob],name,{type:"application/pdf"})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).catch(function(e){if(e&&e.name!=="AbortError")savePdf(blob,name)});
  }else savePdf(blob,name);
}
function reportPrint(el){if(!ownGuard())return;
  el=el&&el.nodeType?el:$("rOut");
  if(!el.querySelector("table")){window.print();return}
  repPage(el).then(function(pg){
    var box=$("pimgBox");box.className=pg.land?"land":"";
    $("pimg").onload=function(){document.body.classList.add("printimg");setTimeout(function(){window.print()},60)};
    $("pimg").src=pg.jpg;
  });
}
window.addEventListener("afterprint",function(){document.body.classList.remove("printimg")});
function reportPdf(el,fname){if(!ownGuard())return;
  el=el&&el.nodeType?el:$("rOut");
  if(!el.querySelector("table")){toast(t("noLessons"));return}
  toast(t("pdfMaking"));
  var fonts=document.fonts?Promise.all([document.fonts.load("22px Naskh"),document.fonts.load("700 22px Naskh")]).catch(function(){}):Promise.resolve();
  fonts.then(function(){return new Promise(function(res){setTimeout(res,30)})}).then(function(){
    return repPage(el);}).then(function(pg){
    var blob=buildPdf([pg]);
    var h2=el.querySelector(".print-head h2"),name=((fname||(h2?h2.textContent:"report")).replace(/[\\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim().slice(0,90))+".pdf";
    var file=null;try{file=new File([blob],name,{type:"application/pdf"})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).catch(function(e){if(e&&e.name!=="AbortError")savePdf(blob,name)});
    }else savePdf(blob,name);
  }).catch(function(e){info(t("pdfFail"),true)});
}
function savePdf(blob,name){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);toast(t("pdfSaved"))}
$("rPdf").onclick=function(){reportPdf()};$("rPrint").onclick=function(){reportPrint()};

/* -- storage of received teacher files (IndexedDB, falls back to localStorage) -- */
var APK=null,LSK="shakir_admin_pk",SUMS={};
function adbOpen(){return new Promise(function(res,rej){try{var r=indexedDB.open("shakir_admin",1);
  r.onupgradeneeded=function(){r.result.createObjectStore("pk")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
function apkLoad(){if(APK)return Promise.resolve(APK);
  return adbOpen().then(function(db){return new Promise(function(res){var out=[],c=db.transaction("pk").objectStore("pk").openCursor();
      c.onsuccess=function(e){var x=e.target.result;if(x){out.push(x.value);x.continue()}else res(out)};c.onerror=function(){res(out)}})})
    .catch(function(){try{var m=JSON.parse(localStorage.getItem(LSK)||"{}");return Object.keys(m).map(function(k){return m[k]})}catch(e){return[]}})
    .then(function(l){APK=l;return l})}
function apkStore(pk,delId){
  var id=delId||pk.tid;APK=(APK||[]).filter(function(x){return x.tid!==id});if(!delId)APK.push(pk);delete SUMS[id];
  return adbOpen().then(function(db){return new Promise(function(res,rej){var tx=db.transaction("pk","readwrite"),st=tx.objectStore("pk");
      if(delId)st.delete(delId);else st.put(pk,pk.tid);tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})})
    .catch(function(){var m={};APK.forEach(function(x){m[x.tid]=x});try{localStorage.setItem(LSK,JSON.stringify(m))}catch(e){toast(t("saveFail"))}})}

/* run fn with a teacher's data in place of D (all the normal register logic then works on it) */
function withD(pd,fn){var keep=D;SWAP++;
  try{D=migrate(JSON.parse(JSON.stringify(pd)));D.ui=D.ui||{};D.ui.lang=keep.ui.lang;EVM={};SAVEV++;buildMK();return fn(keep)}
  finally{D=keep;SWAP--;EVM={};SAVEV++;buildMK()}}

function semDone(sid,stu,sem){var c=gbCfg(),ex=c.comps.filter(function(x){return!x.sub});if(!ex.length)return semRes(sid,stu,sem)!=null;
  return ex.every(function(x){return compSem(sid,stu,sem,x)!=null})}
function pkSum(pk){var k=pk.tid+"@"+pk.at;if(SUMS[pk.tid]&&SUMS[pk.tid].k===k)return SUMS[pk.tid];
  var r=withD(pk.data,function(){var on=gbCfg().on;
    return{k:k,tid:pk.tid,name:pk.name||D.info.teacher||"?",at:pk.at,subj:allSubj(),secs:D.sections.map(function(sc){
      var g=grade(sc.gradeId),recs=recordsOf(sc.id);
      return{sid:sc.id,gk:gShort(g)+"|"+normName(sc.label),gs:gShort(g),grade:g.name,label:sc.label,subj:subjOf(sc),full:fullName(sc),
        students:sc.students.map(function(st,i){var am={},A=0,E=0;
          recs.forEach(function(rr){var v=rr.m[st.id];if(v==="A"){A++;var ym=rr.date.slice(0,7);am[ym]=(am[ym]||0)+1}else if(v==="E")E++});
          return{no:i+1,name:st.name,nk:normName(st.name),A:A,E:E,am:am,r1:on&&semDone(sc.id,st.id,1)?semRes(sc.id,st.id,1):null,r2:on&&semDone(sc.id,st.id,2)?semRes(sc.id,st.id,2):null}})}})}});

/* ================= LESSONS: PowerPoint / PDF files kept in the browser (IndexedDB) or links ================= */
function fdb(){return new Promise(function(res,rej){try{var r=indexedDB.open("shakir_files",1);
  r.onupgradeneeded=function(){r.result.createObjectStore("f")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
function fPut(k,rec){return fdb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction("f","readwrite");tx.objectStore("f").put(rec,k);tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})})}
function fGet(k){return fdb().then(function(db){return new Promise(function(res){var q=db.transaction("f").objectStore("f").get(k);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}})}).catch(function(){return null})}
function fDel(k){return fdb().then(function(db){return new Promise(function(res){var tx=db.transaction("f","readwrite");tx.objectStore("f").delete(k);tx.oncomplete=function(){res()};tx.onerror=function(){res()}})}).catch(function(){})}
function fKeys(){return fdb().then(function(db){return new Promise(function(res){var q=db.transaction("f").objectStore("f").getAllKeys();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}})}).catch(function(){return[]})}
var FK={},LFILE=null;
function lesOf(gid){D.lessons=D.lessons||{};return D.lessons[gid]||(D.lessons[gid]=[])}
function taughtOf(sid){D.taught=D.taught||{};return D.taught[sid]||(D.taught[sid]={})}
function fmtSize(b){return b>1048576?(Math.round(b/104857.6)/10)+" MB":Math.max(1,Math.round(b/1024))+" KB"}
function openBlob(blob,name){
  var url=URL.createObjectURL(blob);
  function dl(){var a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
  if(/pdf/i.test(blob.type)||/\.pdf$/i.test(name)){var w=window.open(url,"_blank");if(!w)dl()}
  else{var file=null;try{file=new File([blob],name,{type:blob.type||"application/octet-stream"})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent))navigator.share({files:[file],title:name}).catch(function(e){if(e&&e.name!=="AbortError")dl()});
    else dl()}
  setTimeout(function(){URL.revokeObjectURL(url)},120000);
}
/* a lessons folder linked on the computer (Chrome / Edge): files are read straight from the folder, never copied */
var HAS_DIR=typeof window.showDirectoryPicker==="function";
var LES_EXT=/\.(pptx?|ppsx?|pdf|docx?)$/i;
function dirKey(gid){return"dir:"+gid}
function listDir(h,pre,depth,out){
  var it=h.values();
  function step(){return it.next().then(function(r){if(r.done)return out;var e=r.value;
    if(e.kind==="file"){if(LES_EXT.test(e.name))out.push({path:pre+e.name,name:e.name,unit:pre.replace(/\/$/,"")});return step()}
    if(depth<2)return listDir(e,pre+e.name+"/",depth+1,out).then(step);return step()})}
  return step();
}
function dirFile(gid,path){
  return fGet(dirKey(gid)).then(function(h){if(!h)return null;
    return h.queryPermission({mode:"read"}).then(function(p){return p==="granted"?p:h.requestPermission({mode:"read"})}).then(function(p){if(p!=="granted")return null;
      var parts=path.split("/"),d=Promise.resolve(h);
      parts.slice(0,-1).forEach(function(n){d=d.then(function(x){return x.getDirectoryHandle(n)})});

/* ---- participation: 6 boxes per evaluation for every student. ✓ by default, tap = ½, tap again = ✗, again = ✓.
   Result = max × (sum of boxes) ÷ 6  (all ✓ = 2) ---- */
var PS_N=6,PSV={a:"·",1:"✓",0.5:"½",0:"✗"},PSC={a:"psA",1:"psY",0.5:"pq5",0:"pq0"};
function psKey(v){return v==null?"a":v}
/* value of a box the teacher has not touched (student did not take part): the teacher chooses ✓ (1), ½ or ✗ (0) */
/* an untouched box = the student has not taken part yet: it carries no mark until the teacher sets ✓, ½ or ✗ */
function psBox(v){return v==null?0:v}
function psCls(v){return PSC[psKey(v)]}
function psSym(v){return PSV[psKey(v)]}
function psMarked(bx){for(var q=0;q<PS_N;q++)if(bx[q]!=null)return true;return false}
/* only the boxes the teacher marked count: grade = max × (sum of marked) ÷ (number marked); empty boxes add nothing and take nothing away */
function psVal(bx,mx){var sum=0,n=0;for(var q=0;q<PS_N;q++)if(bx[q]!=null){sum+=bx[q];n++}return n?Math.round(mx*sum/n*10)/10:null}
function psFillBar(){return'<div class="psdef"><span>'+t("psFillL")+'</span><div class="seg">'+[1,0.5,0].map(function(x){return'<button data-psfill="'+x+'">'+PSV[x]+" "+t(x===1?"psDef1":x===0.5?"psDef5":"psDef0")+"</button>"}).join("")+"</div></div>"}
function psOf(secId,sem,cid){D.ps=D.ps||{};var k=secId+"|"+sem+"|"+cid;return D.ps[k]||(D.ps[k]={})}
function parMax(){var x=evSubs().filter(function(z){return z.src==="par"})[0];return x?+x.max:2}
function renderPS(s,date){
  var e=evAt(date);
  if(!e||!gbCfg().on){$("tBody").innerHTML='<div class="card empty">'+t("psNoEv")+"</div>";return}
  var P=psOf(s.id,e.sem,e.cc.id),mx=parMax(),att=D.records[rk(s.id,date)]||{};
  var h='<div class="card" style="padding:10px 12px;margin-bottom:8px"><b>⭐ '+t("psHead",{c:esc(compName(e.cc)),s:esc(semName(e.sem)),m:mx})+'</b><div class="note" style="margin-top:4px">'+t("psHelp")+"</div>"+psFillBar()+"</div>";
  h+='<input type="text" id="tFilter" placeholder="'+esc(t("search"))+'" value="'+esc(filterTxt)+'" style="margin-bottom:8px"><div class="list" id="psList">';
  s.students.forEach(function(u,i){
    if(filterTxt&&u.name.indexOf(filterTxt)<0)return;
    var bx=P[u.id]||{},sum=0,cells="";
    for(var q=0;q<PS_N;q++){var v=bx[q];cells+='<button class="psb '+psCls(v)+'" data-ps="'+u.id+'" data-q="'+q+'">'+psSym(v)+"</button>"}
    var val=psVal(bx,mx);
    h+='<div class="stu ps'+(att[u.id]==="A"?" dis":"")+'"><span class="n">'+(i+1)+'</span><span class="nm">'+esc(u.name)+(att[u.id]==="A"?'<div class="tot">'+t("isAbsent")+"</div>":"")+'</span><div class="psrow">'+cells+'<b class="psv'+(val!=null&&val<mx?" lo":"")+'">'+(val!=null?val:"–")+"</b></div></div>";
  });
  $("tBody").innerHTML=h+"</div>";
  $("psList").onclick=function(ev){var b=ev.target.closest("[data-ps]");if(!b)return;var id=b.dataset.ps,q=+b.dataset.q,bx=P[id]||(P[id]={}),v=bx[q]==null?1:bx[q];
    var cur=bx[q];v=cur==null?1:cur===1?0.5:cur===0.5?0:null;if(v==null)delete bx[q];else bx[q]=v;if(!Object.keys(bx).length)delete P[id];save();
    b.className="psb "+psCls(v);b.textContent=psSym(v);var val=psVal(bx,mx),o=b.parentNode.querySelector(".psv");o.textContent=val!=null?val:"–";o.classList.toggle("lo",val!=null&&val<mx)};
  $("tBody").querySelector(".psdef").onclick=function(ev){var b=ev.target.closest("[data-psfill]");if(!b)return;var x=+b.dataset.psfill;
    ask(t("psFillQ",{v:PSV[x]}),function(){s.students.forEach(function(u){var bx=P[u.id]||(P[u.id]={});for(var q=0;q<PS_N;q++)if(bx[q]==null)bx[q]=x});save();renderTake()})};
  $("tFilter").oninput=function(){filterTxt=this.value.trim();var p0=this.selectionStart;renderTake();var f=$("tFilter");f.focus();f.setSelectionRange(p0,p0)};
}

/* ---- collective participation (exit ticket / answer cards): everyone present = ✓, tap = ½, tap again = ✗ ---- */
function pqSwitch(){return'<div class="seg pqsw" style="margin:0 0 10px"><button data-pqm="0" class="'+(D.ui.pqOn?"":"on")+'">⭐ '+t("pqOral")+'</button><button data-pqm="1" class="'+(D.ui.pqOn?"on":"")+'">📝 '+t("pqGroup")+"</button></div>"}

function pqFew(s,date){var e=evAt(date);if(!e)return null;var st=evStats(s.id,e.sem,e.cc.ev);if(st.pqN<2)return null;
  return s.students.filter(function(u){var q=st.pq[u.id]||{n:0};return q.n+((st.st.part||{})[u.id]||0)<2})}
function renderPQ(s,date){

  h+='<div class="stats"><div class="stat g"><b>'+n1+"</b>✓ "+t("pqRight")+'</div><div class="stat"><b style="color:#b7791f">'+n5+"</b>½ "+t("pqHalf")+'</div><div class="stat"><b style="color:var(--abs)">'+n0+"</b>✗ "+t("pqWrong")+"</div></div>";

  var few=pqFew(s,date);if(few&&few.length)h+='<div class="warn" style="margin-bottom:8px">'+t("pqFew",{n:few.length})+" "+few.slice(0,12).map(function(u){return esc(u.name.split(" ").slice(0,2).join(" "))}).join("، ")+(few.length>12?" …":"")+"</div>";
  h+='<div class="list">';
  s.students.forEach(function(u,i){var absent=att[u.id]==="A",v=rec[u.id];
    h+='<div class="stu'+(absent?" dis":"")+'" data-pq="'+u.id+'"><span class="n">'+(i+1)+'</span><span class="nm">'+esc(u.name)+"</span>"+
      (absent?'<span class="pc">'+t("isAbsent")+"</span>":'<span class="pqb '+(v==null?"":PQC[v])+'">'+(v==null?"—":PQV[v])+"</span>")+"</div>"});
  h+='</div><div class="toolbar"><button class="btn ghost" id="pqDel">'+t("pqDel")+"</button></div>";
  $("tBody").innerHTML=h;

    if(att[id]==="A"){toast(t("stuAbsent"));return}
    var v=rec[id];rec[id]=v===1?0.5:v===0.5?0:1;save();renderTake()};
  $("pqDel").onclick=function(){ask(t("pqDelQ"),function(){delete D.pq[k];save();renderTake()})};
}

function gbCfg(){
  if(!D.gbCfg)D.gbCfg={v2:1,on:false,months:1,comps:[{id:"c1",n:"",max:10},{id:"c2",n:"",max:20},{id:"c3",n:"",max:10},{id:"c4",n:"",max:60}]};
  var c=D.gbCfg;
  if(!c.v2){ // old default (2 months, unnamed comps) -> one block per semester
    if(c.months===2&&c.comps.length===4&&c.comps.every(function(x,i){return x.id==="c"+(i+1)&&!x.n}))c.months=1;
    c.v2=1;
  }
  if(!c.v3){ // split the two 10-mark evaluations into 5 x 2
    var ev=0;c.comps.forEach(function(x){if(x.id==="c1"||x.id==="c3"){if(+x.max===10){x.sub=1;x.ev=++ev}}});
    c.months=1;c.v3=1;
  }
  if(!c.per){var y=+schoolYear().split("-")[1];
    c.per={1:{start:y+"-09-20",mid:y+"-11-08",end:y+"-12-14"},2:{start:(y+1)+"-01-03",mid:(y+1)+"-02-21",end:(y+1)+"-04-09"}}}
  c.comps.forEach(function(x){if(x.sub)x.max=subMax()});

}
function evSubs(){var c=D.gbCfg||gbCfg();if(!c.subs)c.subs=[{id:"par",src:"par",max:2},{id:"cq",src:"cq",max:2},{id:"att",src:"att",max:2},{id:"q1",src:"man",max:2},{id:"q2",src:"man",max:2}];c.subs.forEach(function(x){if(x.src==="judge")x.src="par"});return c.subs}
var SUBDEF={par:"subPar",cq:"subCq",att:"subAtt"};
function subName(x){return x.n||(SUBDEF[x.id]?t(SUBDEF[x.id]):x.id==="q1"?t("subQ",{n:1}):x.id==="q2"?t("subQ",{n:2}):t("newSub"))}
function subMax(){return evSubs().reduce(function(a,x){return a+(+x.max||0)},0)}
/* sources an evaluation field can be computed from: dir +1 = each mark adds, -1 = each mark deducts */
function srcAll(){
  var l=[{k:"att",n:t("modeAtt"),dir:-1,on:true},{k:"par",n:t("modePar"),dir:1,on:trkOn("par"),store:["part"]},
    {k:"clean",n:t("modeClean"),dir:-1,on:trkOn("clean"),store:["clean"]},{k:"noise",n:t("modeNoise"),dir:-1,on:trkOn("noise"),store:["noise"]},
    {k:"cq",n:t("modeClean")+" + "+t("modeNoise"),dir:-1,on:trkOn("clean")||trkOn("noise"),store:["clean","noise"].filter(trkOn)}];
  (D.custom||[]).forEach(function(c){var m=MK["x"+c.id];l.push({k:"x"+c.id,n:m?m.label:c.name,dir:c.type==="pos"?1:-1,on:true,store:["cx_"+c.id]})});
  return l;
}
function srcOf(k){if(k==="man")return null;var r=srcAll().filter(function(x){return x.k===k})[0];return r&&r.on?r:null}
var EVM={};
function evRange(sem,ev){var p=gbCfg().per[sem]||{};return ev===1?[p.start,p.mid,false]:[p.mid,p.end,true]}
function inRange(d,r){return d>=r[0]&&(r[2]?d<=r[1]:d<r[1])}
function evStats(secId,sem,ev){
  var k=SAVEV+"|"+secId+"|"+sem+"|"+ev;if(EVM.v===SAVEV&&EVM[k])return EVM[k];
  var r=evRange(sem,ev),o={lessons:0,A:{},st:{},pqN:0,pq:{}};
  if(r[0]&&r[1]){
    recordsOf(secId).forEach(function(x){if(!inRange(x.date,r))return;o.lessons++;for(var s in x.m)if(x.m[s]==="A")o.A[s]=(o.A[s]||0)+1});
    ["part","clean","noise"].concat((D.custom||[]).map(function(c){return"cx_"+c.id})).forEach(function(stn){
      var m=o.st[stn]={};recordsOf(secId,D[stn]||{}).forEach(function(x){if(!inRange(x.date,r))return;for(var s in x.m)m[s]=(m[s]||0)+x.m[s]})});
    recordsOf(secId,D.pq||{}).forEach(function(x){if(!inRange(x.date,r))return;o.pqN++;
      for(var s in x.m){var q=o.pq[s]||(o.pq[s]={p:0,n:0});q.p+=x.m[s];q.n++}});
  }
  if(EVM.v!==SAVEV)EVM={v:SAVEV};EVM[k]=o;return o;
}
function stuFrom(secId,stuId){var x=sec(secId),u=x&&x.students.filter(function(z){return z.id===stuId})[0];return u&&u.from||null}
function mergeStats(a,b,id){ // a copy of a with b's numbers for one student added
  var o={lessons:Math.max(a.lessons,b.lessons),A:Object.assign({},a.A),st:{},pqN:a.pqN+b.pqN,pq:Object.assign({},a.pq)};
  o.A[id]=(a.A[id]||0)+(b.A[id]||0);
  Object.keys(a.st).concat(Object.keys(b.st)).forEach(function(k){o.st[k]=Object.assign({},a.st[k]||{});o.st[k][id]=((a.st[k]||{})[id]||0)+((b.st[k]||{})[id]||0)});
  var p1=a.pq[id]||{p:0,n:0},p2=b.pq[id]||{p:0,n:0};if(p1.n||p2.n)o.pq[id]={p:p1.p+p2.p,n:p1.n+p2.n};
  return o;
}
function subVals(secId,stuId,sem,m,c){
  var fr=stuFrom(secId,stuId),st=fr?mergeStats(evStats(secId,sem,c.ev),evStats(fr,sem,c.ev),stuId):evStats(secId,sem,c.ev),o=gGet(secId,stuId,gKey(sem,m)),v={lessons:st.lessons,items:[]};
  evSubs().forEach(function(x){
    var src=srcOf(x.src),it={sub:x,max:+x.max||0,auto:!!src};
    if(src&&src.k==="par"){var bx=psOf(secId,sem,c.id)[stuId]||{},sum=0;
      it.val=psVal(bx,it.max);it.ps=bx}
    else if(src&&src.k==="judge"){var jd=judgeOf(secId,sem,c.id,x.id)[stuId]||0;it.judge=1;it.jd=jd;it.val=Math.max(0,r2(it.max-jd*it.max/4))}
    else if(src){
      if(st.lessons){
        var cnt=src.k==="att"?(st.A[stuId]||0):src.store.reduce(function(a,sn){return a+((st.st[sn]||{})[stuId]||0)},0);
        it.cnt=cnt;it.val=src.dir>0?Math.min(it.max,cnt):Math.max(0,it.max-cnt);
        if(src.k==="par"&&st.pqN){var q=st.pq[stuId]||{p:0,n:0},oral=(st.st.part||{})[stuId]||0,opp=q.n+oral;
          it.cnt=opp;it.opp=opp;it.val=opp?Math.round(it.max*(q.p+oral)/opp*2)/2:null;if(opp<2)it.few=1}
      }
    }else{
      var raw=o[c.id+"."+x.id],qi=qInfo(secId,sem,c.id,x.id);
      if(raw==="A"){it.abs=1;it.val=0}
      else if(raw==null&&qi.d&&(D.records[rk(secId,qi.d)]||{})[stuId]==="A"){it.abs=1;it.absReg=1;it.val=0}
      else{var qo=qOut(secId,sem,c.id,x);it.out=qo;if(raw!=null&&typeof raw==="number"){it.raw=raw;it.val=qConv(raw,qo,it.max)}else it.val=raw}
    }
    if(it.val===undefined)it.val=null;v.items.push(it);
  });
  return v;
}
function compVal(secId,stuId,sem,m,c){
  if(!c.sub){var o=gGet(secId,stuId,gKey(sem,m));return o[c.id]!=null?o[c.id]:null}
  // an evaluation total (out of 10) appears only once every one of its fields has a mark
  var v=subVals(secId,stuId,sem,m,c),all=v.items.length>0,sum=0;
  v.items.forEach(function(it){if(it.val==null)all=false;else sum+=it.val});
  return all?Math.round(sum+1e-9):null; // whole marks only: .5 and above rounds up, below .5 rounds down
}

/* D.tt = {shifts:["m"|"e" x5 (Sun..Thu)], grid:[5][6] secId|null, times:{...}} */
var TT_P=8,TT_DEF={np:6,one:false,mStart:"08:00",eStart:"12:30",len:40,gap:5,breakAfter:3,breakLen:15,lead:5,atStart:true};

function hmD(d){return pad(d.getHours())+":"+pad(d.getMinutes())}
function ttTimes(sh){
  var c=ttCfg().times,s=toMin(sh==="m"||c.one?c.mStart:c.eStart),len=+c.len||40,o=[];
  for(var i=0;i<ttP();i++){o.push([s,s+len]);s+=len+(i+1===+c.breakAfter?(+c.breakLen||0):(+c.gap||0))}

}

function ttLessons(){
  var out=[],now=new Date(),c=ttCfg();

}
function ttCurNext(){var now=new Date(),L0=ttLessons();
  return{cur:L0.filter(function(l){return now>=l.start&&now<l.end})[0],next:L0.filter(function(l){return l.start>now})[0]}}
function ttToday(){ // the lesson that matters right now (from "lead" minutes before it until it ends)
  var now=new Date(),lead=(+ttCfg().times.lead||0)*60000,today=ymd(now);
  return ttLessons().filter(function(l){return ymd(l.start)===today&&now>=l.start-lead&&now<l.end})[0];
}
function lessonKey(l){return l.sid+"@"+l.start.getTime()}

/* ---- timetable tab ---- */
function ttStatusHTML(){
  var cn=ttCurNext(),now=new Date();
  if(cn.cur){var s=sec(cn.cur.sid);return'<div class="ttnow live"><div class="tx"><b>'+t("ttNow",{p:cn.cur.p+1})+" — "+esc(fullName(s))+"</b>"+t("ttEnds",{t:hmD(cn.cur.end)})+'</div><button class="btn sm" data-go="'+cn.cur.sid+'">'+t("openTake")+"</button></div>"}
  if(cn.next){var s2=sec(cn.next.sid),mins=Math.round((cn.next.start-now)/60000),same=ymd(cn.next.start)===ymd(now);
    return'<div class="ttnow"><div class="tx"><b>'+t("ttNext",{p:cn.next.p+1})+" — "+esc(fullName(s2))+"</b>"+(same?"":L().days[cn.next.di]+" · ")+hmD(cn.next.start)+(same&&mins<180?" · "+t("ttIn",{n:mins}):"")+"</div></div>"}
  return'<div class="ttnow"><div class="tx">'+t(D.sections.length?"ttNone":"ttNoSecs")+"</div></div>";
}
function renderTt(){
  var c=ttCfg(),now=new Date(),today=now.getDay(),lead=(+c.times.lead||0)*60000;
  $("ttStatus").innerHTML=ttStatusHTML();
  $("ttNotify").textContent=t(ttAlertsOn?"ttNotifyOn":"ttNotify");$("ttNotify").classList.toggle("on",ttAlertsOn);
  $("ttPH").textContent=t("ttHead");$("ttPS").textContent=[D.info.teacher,allSubj(),D.info.school].filter(Boolean).join(" — ");
  var h='<thead><tr><th class="d"></th>';for(var p=0;p<ttP();p++)h+="<th>"+(p+1)+"</th>";h+="</tr></thead><tbody>";
  for(var di=0;di<5;di++){
    var sh=c.shifts[di],tm=ttTimes(sh),isT=di===today;
    h+='<tr class="'+(isT?"today":"")+'"><th class="d">'+esc(L().days[di])+(ttOne()?"":'<button type="button" class="shf '+sh+'" data-shf="'+di+'">'+t(sh==="m"?"morning":"evening")+"</button>")+"</th>";
    for(p=0;p<ttP();p++){
      var id=c.grid[di][p],ok=secOk(id),cls=ok?"":"e";
      if(ok&&isT){var a=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime()+tm[p][0]*60000,b=a+(tm[p][1]-tm[p][0])*60000;
        if(now>=a&&now<b)cls+=" now";else if(now>=a-lead&&now<a)cls+=" soon"}
      var inner="";
      if(ok){var s=sec(id),g=grade(s.gradeId),gs=gShort(g);
        inner=(subjOf(s)?'<span class="g">'+esc(subjOf(s))+"</span>":"")+'<span class="l">'+(gs.length<=3?esc(gs)+" - "+esc(s.label):esc(s.label))+"</span>"+(gs.length>3?'<span class="g">'+esc(gs)+"</span>":"")}
      if(ok){var dd=new Date(now.getFullYear(),now.getMonth(),now.getDate()+((di-today+7)%7)),qz=quizToday(id,ymd(dd));if(qz)inner+='<span class="qz">📝 '+esc(qz)+" "+shortD(ymd(dd))+"</span>"}
      h+='<td class="'+cls+'" data-d="'+di+'" data-p="'+p+'">'+inner+'<span class="tm">'+hm(tm[p][0])+"–"+hm(tm[p][1])+"</span></td>";
    }
    h+="</tr>";
  }
  $("ttTbl").innerHTML=h+"</tbody>";
  var T0=c.times;$("ttMS").value=T0.mStart;$("ttES").value=T0.eStart;$("ttLen").value=T0.len;$("ttGap").value=T0.gap;
  $("ttBA").value=String(T0.breakAfter);$("ttBL").value=T0.breakLen;$("ttLead").value=T0.lead;$("ttAtS").checked=!!T0.atStart;
  $("ttNP").value=String(ttP());$("ttOne").checked=ttOne();
  $("ttPre").classList.toggle("hidden",ttOne());$("ttES").parentNode.classList.toggle("hidden",ttOne());
  $("ttMSL").textContent=t(ttOne()?"ttMS1":"ttMS");
  $("ttTbl").classList.toggle("np7",ttP()===7);$("ttTbl").classList.toggle("np8",ttP()===8);
  var bo=+T0.breakAfter;$("ttBA").innerHTML='<option value="0">—</option>'+Array.from({length:ttP()-1},function(_,i){return"<option"+(bo===i+1?" selected":"")+">"+(i+1)+"</option>"}).join("");$("ttBA").value=String(bo<ttP()?bo:0);
  var empty=c.grid.every(function(r){return r.every(function(x){return!secOk(x)})});
  $("ttFill").classList.toggle("hidden",!(empty&&g12()));
  applyLocks();
}
$("ttTbl").addEventListener("click",function(e){
  var b=e.target.closest("[data-shf]");
  if(b){if(isLocked("tt"))return;var i=+b.dataset.shf,c=ttCfg();c.shifts[i]=c.shifts[i]==="m"?"e":"m";save();renderTt();return}
  var td=e.target.closest("td[data-d]");if(!td)return;
  if(isLocked("tt")){toast(t("lockedBar"));return}

  $("ttmTitle").textContent=t("cellTitle",{d:L().days[d],p:p+1});
  fillSelect($("ttmSel"),cur);
  $("ttmSel").insertAdjacentHTML("afterbegin",'<option value="">'+esc(t("cellEmpty"))+"</option>");
  $("ttmSel").value=secOk(cur)?cur:"";
  $("ttmOk").textContent=t("save");$("ttmNo").textContent=t("cancel");
  $("ttModal").classList.remove("hidden");
  $("ttmOk").onclick=function(){ttCfg().grid[d][p]=$("ttmSel").value||null;save();$("ttModal").classList.add("hidden");renderTt()};
});
$("ttmNo").onclick=function(){$("ttModal").classList.add("hidden")};
$("ttModal").addEventListener("click",function(e){if(e.target.id==="ttModal")$("ttModal").classList.add("hidden")});
$("ttPre").addEventListener("click",function(e){var b=e.target.closest("[data-pre]");if(!b||isLocked("tt"))return;ttCfg().shifts=b.dataset.pre.split("");save();renderTt()});
[["ttMS","mStart","s"],["ttES","eStart","s"],["ttLen","len"],["ttGap","gap"],["ttBA","breakAfter"],["ttBL","breakLen"],["ttLead","lead"]].forEach(function(f){
  $(f[0]).addEventListener("change",function(){
    var v=this.value;if(f[2]!=="s"){v=Math.max(0,Math.min(120,+v||0));if(f[1]==="len"&&v<5)v=5}else if(!v)v=TT_DEF[f[1]];
    ttCfg().times[f[1]]=v;save();ttPrimeFired();renderTt();
  });
});
$("ttAtS").addEventListener("change",function(){ttCfg().times.atStart=this.checked;save()});
$("ttNP").addEventListener("change",function(){var n=+this.value,c=ttCfg(),lost=0;
  c.grid.forEach(function(r){for(var p=n;p<8;p++)if(secOk(r[p]))lost++});
  var go=function(){c.times.np=n;save();ttPrimeFired();renderTt()};
  if(lost){this.value=String(ttP());ask(t("ttNPLost",{n:lost}),go)}else go()});
$("ttOne").addEventListener("change",function(){ttCfg().times.one=this.checked;save();ttPrimeFired();renderTt()});
$("ttPrint").onclick=function(){window.print()};

/* ---- pre-fill: the 12th-grade timetable of م. شاكر (2025-2026 sheet) ---- */
var SHAKIR=[["د","","هـ","","و","أ"],["","","أ","ج","","ب"],["د","أ","و","","",""],["هـ","ج","د","ب","",""],["هـ","و","ج","ب","",""]];
function normL(x){return String(x).replace(/[ـ\s]/g,"").replace(/[أإآ]/g,"ا")}
function g12(){return D.grades.filter(function(g){return gShort(g)==="12"&&secsOf(g.id).length})[0]}
$("ttFill").onclick=function(){
  var g=g12();if(!g||isLocked("tt"))return;var map={},n=0,c=ttCfg();
  secsOf(g.id).forEach(function(s){map[normL(s.label)]=s.id});
  SHAKIR.forEach(function(row,d){row.forEach(function(l,p){if(l&&map[normL(l)]){c.grid[d][p]=map[normL(l)];n++}})});
  save();ttPrimeFired();renderTt();toast(t("ttFilled",{n:n}));
};

/* ---- banner on the attendance screen ---- */
function ttTakeBanner(){
  var el=$("tNow");if(!el)return;
  var l=ttToday(),date=$("tDate").value,today=ymd(new Date());
  if(!l||date!==today){
    var cn=ttCurNext();l=null;
    if(date===today&&cn.next&&ymd(cn.next.start)===today){var s0=sec(cn.next.sid);
      el.innerHTML='<div class="ttnow"><div class="tx">'+esc(t("tNextLbl",{p:cn.next.p+1,t:hmD(cn.next.start),s:fullName(s0)}))+"</div>"+(cn.next.sid!==D.ui.sec?'<button class="btn sm ghost" data-go="'+cn.next.sid+'">'+t("choose")+"</button>":"")+"</div>";return}
    el.innerHTML="";return;
  }
  var s=sec(l.sid);
  el.innerHTML='<div class="ttnow live"><div class="tx"><b>'+esc(t("tNowLbl",{p:l.p+1,s:fullName(s)}))+"</b>"+hmD(l.start)+"–"+hmD(l.end)+"</div>"+(l.sid!==D.ui.sec?'<button class="btn sm" data-go="'+l.sid+'">'+t("choose")+"</button>":"")+"</div>";
}
$("tNow").addEventListener("click",function(e){var b=e.target.closest("[data-go]");if(b)ttGo(b.dataset.go)});
function ttGo(sid){D.ui.sec=sid;D.ui.mode="att";filterTxt="";$("tDate").value=ymd(new Date());save();show("take")}

/* ---- alerts: sound + on-screen message + system notification (when allowed) ---- */
var ttAlertsOn=false,ttAudio=null,ttFired={},ttAutoKey=null,ttFlash=null,baseTitle=document.title;
function ttUnlockAudio(){try{ttAudio=ttAudio||new(window.AudioContext||window.webkitAudioContext)();if(ttAudio.state==="suspended")ttAudio.resume()}catch(e){}}
document.addEventListener("click",function(){ttUnlockAudio();if(ttFlash){clearInterval(ttFlash);ttFlash=null;document.title=baseTitle}},true);
function ttBeep(n){
  if(!ttAudio)return;try{
  var t0=ttAudio.currentTime;
  for(var i=0;i<n;i++){var o=ttAudio.createOscillator(),g=ttAudio.createGain(),st=t0+i*.45;
    o.type="sine";o.frequency.value=i%2?660:880;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.4,st+.03);g.gain.exponentialRampToValueAtTime(.0001,st+.38);
    o.connect(g);g.connect(ttAudio.destination);o.start(st);o.stop(st+.4)}
  }catch(e){}
}
$("ttNotify").onclick=function(){
  ttUnlockAudio();ttAlertsOn=true;ttBeep(1);
  try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission()}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){ttWake=w},function(){})}catch(e){}
  renderTt();
};
var ttWake=null;
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible")return;
  if(ttAlertsOn&&navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){ttWake=w},function(){});
  ttTick();
});
function ttFire(kind,l){
  var s=sec(l.sid),lead=+ttCfg().times.lead||0;
  var head=kind==="soon"?t("alertSoon",{n:lead,p:l.p+1}):t("alertNow",{p:l.p+1});
  var qz=quizToday(l.sid,ymd(l.start)),body=fullName(s)+(subjOf(s)?" — "+subjOf(s):"")+"\n"+hmD(l.start)+" – "+hmD(l.end)+(qz?"\n📝 "+t("tqAlert",{x:qz}):"");
  ttBeep(kind==="soon"?3:4);
  try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}
  try{if(window.Notification&&Notification.permission==="granted"){var nt=new Notification(head,{body:body,tag:"lesson"});nt.onclick=function(){window.focus();ttGo(l.sid);nt.close()}}}catch(e){}
  if(ttFlash)clearInterval(ttFlash);var f=0;ttFlash=setInterval(function(){document.title=(f++%2)?"🔔 "+head:baseTitle},900);
  if($("modal").classList.contains("hidden")&&$("ttModal").classList.contains("hidden")){
    dialog(head+"\n"+body,function(){ttGo(l.sid)});$("mOk").textContent=t("openTake");$("mNo").textContent=t("close");
  }else toast(head);
}
function ttPrimeFired(){ // don't ring for alerts whose time already passed
  var now=new Date(),lead=(+ttCfg().times.lead||0)*60000;
  ttLessons().forEach(function(l){var k=lessonKey(l);if(now>=l.start-lead)ttFired[k+"w"]=1;if(now-l.start>=90000)ttFired[k+"s"]=1});
}
function ttTick(){
  if(!D)return;var now=new Date(),c=ttCfg(),lead=(+c.times.lead||0)*60000;
  ttLessons().forEach(function(l){
    var k=lessonKey(l);
    if(lead&&now>=l.start-lead&&now<l.start&&!ttFired[k+"w"]){ttFired[k+"w"]=1;ttFired[k+"s"]=c.times.atStart?ttFired[k+"s"]:1;ttFire("soon",l)}
    else if(c.times.atStart&&now>=l.start&&now-l.start<90000&&!ttFired[k+"s"]){ttFired[k+"s"]=1;ttFire("now",l)}
  });
  if(cur==="tt")renderTt();
  if(cur==="take")ttTakeBanner();
}

/* ================= LOCKS (removed) =================
   The protection lock was removed: nothing is ever locked. These stubs keep the

}

var cur="take";

  if(OWN_BAD)return;

  if(v==="rep"){var k2=$("rSec").value;$("rSec").dataset.k="";fillSelect($("rSec"),k2&&D.sections.some(function(s){return s.id===k2})?k2:D.ui.sec);periods();renderRep()}
  if(v==="set")renderSet();
  if(v==="gr")renderGr();
  if(v==="adm")renderAdm();
  if(v==="les")renderLes();
  if(v==="set")renderLocks();
